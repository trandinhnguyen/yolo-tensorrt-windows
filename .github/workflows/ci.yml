name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Windows, Python 3.10)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen  # the UI tests run without a display
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # PyTorch from PyPI is the CPU build on Windows, which is all the tests
      # need: they don't touch the GPU, TensorRT or FFmpeg.
      - name: Install dependencies
        run: |
          uv venv --python 3.10
          uv pip install -r pyproject.toml --extra dev

      - name: Lint
        run: |
          .venv\Scripts\ruff check .
          .venv\Scripts\ruff format --check .

      - name: Test
        run: .venv\Scripts\python -m pytest -v
